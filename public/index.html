<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>mAI office</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="topbar">
    <div class="logo">▣ mAI office</div>
    <span id="modeBadge" class="badge">…</span>
    <span id="conn" class="badge off">offline</span>
    <div class="spacer"></div>
    <button id="sessBtn" class="btn" title="Browse the Claude Code sessions and Cursor CLI chats on this computer and resume one at a desk">Sessions</button>
    <button id="hireBtn" class="btn green">＋ Hire agent</button>
    <button id="fireBtn" class="btn red" disabled>✖ Fire agent</button>
  </header>

  <main>
    <section id="stage"><canvas id="office" width="384" height="240"></canvas></section>

    <aside id="chat">
      <div id="chatEmpty">
        <div class="big">☝</div>
        <p>Click a pixel person to open their chat.</p>
        <p class="dim">No agents yet? Hit <b>Hire agent</b> or click an empty desk.</p>
      </div>
      <div id="chatBody" hidden>
        <div id="chatHead">
          <canvas id="avatar" width="20" height="26"></canvas>
          <div class="meta">
            <div class="nameRow"><span id="chatName">—</span><span id="chatType" class="typebadge">—</span><span id="mainBadge" class="mainbadge" title="Main agent: sits at the manager desk" hidden>★ main</span></div>
            <div id="chatCwd" class="dim">—</div>
          </div>
          <button type="button" id="mainBtn" class="btn small" title="Move this agent to the manager desk and make them the main agent (the current main swaps to this desk)" hidden>★ Make main</button>
          <span id="chatState" class="pill idle">idle</span>
        </div>
        <details id="teamBox" open hidden>
          <summary>👥 Team activity <span id="teamCount" class="dim"></span></summary>
          <div id="teamLog"></div>
        </details>
        <div id="transcript"></div>
        <form id="composer">
          <div id="slashPop" role="listbox" aria-label="Slash commands" hidden></div>
          <textarea id="input" rows="2" placeholder="Type a message… (Enter to send, Shift+Enter for newline)" aria-autocomplete="list" aria-controls="slashPop" aria-expanded="false"></textarea>
          <button type="button" id="modeLine" class="modeLine" title="Permission mode for this agent's next run. Shift+Tab in the message box also cycles it."></button>
          <div class="row">
            <span id="queueInfo" class="dim"></span>
            <button type="button" id="teamBtn" class="btn small" title="Mock agents only: spawn 2-3 parallel helpers (same as /team <task>)" hidden>👥 Team task</button>
            <select id="relayTo" class="relay" title="Send to another agent: the text is forwarded as input prefixed [from <name>]"><option value="">this agent</option></select>
            <button type="button" id="stopBtn" class="btn red small" hidden>■ Stop</button>
            <button type="submit" class="btn green small">Send ⏎</button>
          </div>
        </form>
      </div>
    </aside>
  </main>

  <dialog id="hireDlg">
    <form id="hireForm" method="dialog">
      <h3>Hire a new agent</h3>
      <label>Name <input id="hireName" maxlength="24" required autocomplete="off"></label>
      <fieldset id="typeChoice"><legend>Agent type</legend><div id="typeOptions"></div></fieldset>
      <label>Working directory <input id="hireCwd" autocomplete="off" spellcheck="false"></label>
      <label>Permission mode <select id="hirePerm" title="Plan: the agent plans first (Claude Code --permission-mode plan) and everybody gathers at the round table"><option value="">Usual (accept edits for Claude)</option><option value="default">Default (tools not pre-approved are denied)</option><option value="plan">Plan (plan first, gather at the round table)</option></select></label>
      <div id="hireNote" class="dim"></div>
      <div class="row">
        <button type="button" id="hireCancel" class="btn">Cancel</button>
        <button type="submit" id="hireOk" class="btn green">Hire</button>
      </div>
    </form>
  </dialog>
  <dialog id="sessDlg" aria-labelledby="sessTitle">
    <div class="sessHead">
      <h3 id="sessTitle">Your local sessions</h3>
      <button type="button" id="sessReload" class="btn small">Refresh</button>
      <button type="button" id="sessClose" class="btn small">Close</button>
    </div>
    <div class="sessTabs" role="tablist" aria-label="Session source">
      <button type="button" role="tab" id="sessTab-claude" class="sessTab" data-src="claude" aria-controls="sessList" aria-selected="true">Claude Code</button>
      <button type="button" role="tab" id="sessTab-cursor" class="sessTab" data-src="cursor" aria-controls="sessList" aria-selected="false" tabindex="-1">Cursor CLI</button>
    </div>
    <p id="sessDir" class="dim"></p>
    <p id="sessFull" class="sessFull" hidden></p>
    <div id="sessList" role="tabpanel" aria-labelledby="sessTab-claude" aria-live="polite"></div>
  </dialog>
  <div id="toast" hidden></div>

  <script src="js/office-flat.js"></script>
  <script src="js/office-iso.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
